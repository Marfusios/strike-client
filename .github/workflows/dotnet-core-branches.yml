name: .NET Core (branch)

on:
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Unit tests
      run: dotnet test test/Strike.Client.Tests/Strike.Client.Tests.csproj --configuration Release --no-build --verbosity normal
    - name: Pack library project
      run: dotnet pack src/Strike.Client/Strike.Client.csproj --configuration Release --no-build -o artifacts
