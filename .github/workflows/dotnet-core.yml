name: .NET Core

on:
  push:
    branches: [ master ]

permissions:
  contents: read   # checkout
  actions: read    # test reporter
  checks: write    # test reporter publishes a check run
  id-token: write  # OIDC token for NuGet Trusted Publishing

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Unit tests
      run: dotnet test test/Strike.Client.Tests/Strike.Client.Tests.csproj --configuration Release --no-build --logger "trx;LogFilePrefix=tests"
    - name: Read-only integration tests
      run: dotnet test test_integration/Strike.Client.IntegrationTests/Strike.Client.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~GetBalances_ShouldWork|FullyQualifiedName~GetRates_ShouldWork|FullyQualifiedName~InvalidUrl_ShouldNotThrowException" --logger "trx;LogFilePrefix=tests"
      env:
          Strike__ApiKey: ${{secrets.STRIKE_API_KEY}}
          Strike__Environment: Live
          Strike__ServerUrl: https://api.strike.me/
    - name: Test Report
      uses: dorny/test-reporter@v3
      if: success() || failure()    # run this step even if previous step failed
      with:
        name: tests
        path: '**/*.trx'
        reporter: dotnet-trx
    - name: Pack library project
      run: dotnet pack src/Strike.Client/Strike.Client.csproj --no-build --configuration Release --include-symbols -p:SymbolPackageFormat=snupkg -o .
    - name: NuGet login (OIDC -> temporary API key)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: marfusios
    - name: Publish library (NuGet)
      run: dotnet nuget push *.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate
    #- name: Publish library (Github)
    #  run: dotnet nuget push *.nupkg --api-key ${{secrets.PUBLISH_TO_GITHUB_TOKEN}} --source "https://nuget.pkg.github.com/marfusios/index.json" --skip-duplicate
